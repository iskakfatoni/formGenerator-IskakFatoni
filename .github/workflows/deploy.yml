name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build & Obfuscate Production Bundles (Terser)
        run: npm run build

      # Otomatis memperbarui parameter query cache buster (?v=COMMIT_SHA) pada script & CSS lokal
      - name: Inject Cache Buster Version
        run: |
          BUILD_VER="${{ github.sha }}"
          SHORT_VER="${BUILD_VER:0:8}"
          sed -i -E "s/(\.js|\.css)(\?v=[^\"']*)?/\1?v=${SHORT_VER}/g" index.html form.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
