<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Document Glass Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Energy Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Checkmark Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Glow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Layer 1: Background Subtle Form Page -->
  <rect x="36" y="24" width="58" height="74" rx="8" fill="#ffffff" fill-opacity="0.2" transform="rotate(6 65 61)" />

  <!-- Layer 2: Main Foreground Form Sheet -->
  <g filter="url(#shadow)">
    <!-- Document Card Body -->
    <path d="M 30 30 
             C 30 25.57, 33.57 22, 38 22 
             L 72 22 
             L 92 42 
             L 92 98 
             C 92 102.43, 88.43 106, 84 106 
             L 38 106 
             C 33.57 106, 30 102.43, 30 98 
             Z" 
          fill="url(#docGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 72 22 
             L 72 36 
             C 72 39.31, 74.69 42, 78 42 
             L 92 42 
             Z" 
          fill="#c7d2fe" />
    <path d="M 72 22 L 92 42" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Form Fields & Lines -->
  <!-- Stylized "I" Pillar & Header bar -->
  <rect x="42" y="34" width="22" height="5.5" rx="2.75" fill="#4f46e5" />
  
  <!-- Interactive Form Inputs / Checkbox representations -->
  <!-- Row 1: Active Radio / Item -->
  <circle cx="45" cy="54" r="4.5" fill="#6366f1" />
  <circle cx="45" cy="54" r="2" fill="#ffffff" />
  <rect x="54" y="51.5" width="26" height="5" rx="2.5" fill="#475569" />

  <!-- Row 2: Generator Node / Toggle Switch -->
  <rect x="40.5" y="66" width="9" height="9" rx="2.5" fill="#06b6d4" />
  <path d="M 43 70.5 L 45 72.5 L 47 68.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="54" y="68" width="22" height="5" rx="2.5" fill="#64748b" />

  <!-- Row 3: Text Input Placeholder Bar -->
  <rect x="40.5" y="82.5" width="40" height="5" rx="2.5" fill="#94a3b8" fill-opacity="0.7" />

  <!-- Circular Success Badge with Checkmark (Floating Bottom Right) -->
  <g filter="url(#badgeShadow)">
    <circle cx="94" cy="94" r="19" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 87 94.5 L 92 99.5 L 102 88.5" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent (Top Left & Top Right) -->
  <path d="M 22 18 Q 22 24, 16 24 Q 22 24, 22 30 Q 22 24, 28 24 Q 22 24, 22 18 Z" fill="#38bdf8" />
  <path d="M 108 26 Q 108 30, 104 30 Q 108 30, 108 34 Q 108 30, 112 30 Q 108 30, 108 26 Z" fill="#facc15" />
</svg>
