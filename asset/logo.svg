<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="fullLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Document Card Gradient -->
    <linearGradient id="fullDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Checkmark Badge Gradient -->
    <linearGradient id="fullBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="fullShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark Group (56x56 scaled into 64 canvas) -->
  <g transform="translate(4, 4)">
    <!-- Squircle Icon Background -->
    <rect x="0" y="0" width="56" height="56" rx="15" fill="url(#fullLogoBg)" filter="url(#fullShadow)" />
    <rect x="0" y="0" width="56" height="56" rx="15" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Angled Background Sheet -->
    <rect x="15" y="9" width="28" height="38" rx="4" fill="#ffffff" fill-opacity="0.22" transform="rotate(6 29 28)" />

    <!-- Foreground Form Sheet -->
    <path d="M 12 12 
             C 12 9.79, 13.79 8, 16 8 
             L 33 8 
             L 44 19 
             L 44 46 
             C 44 48.21, 42.21 50, 40 50 
             L 16 50 
             C 13.79 50, 12 48.21, 12 46 
             Z" 
          fill="url(#fullDocGrad)" />
    
    <!-- Folded Corner -->
    <path d="M 33 8 L 33 16 C 33 17.66, 34.34 19, 36 19 L 44 19 Z" fill="#c7d2fe" />
    <path d="M 33 8 L 44 19" stroke="#a5b4fc" stroke-width="1" />

    <!-- Form Content Elements -->
    <rect x="17" y="14" width="11" height="3" rx="1.5" fill="#4f46e5" />
    
    <!-- Choice Row 1 -->
    <circle cx="19" cy="24" r="2.2" fill="#6366f1" />
    <circle cx="19" cy="24" r="1" fill="#ffffff" />
    <rect x="23" y="22.8" width="13" height="2.5" rx="1.25" fill="#475569" />

    <!-- Checkbox Row 2 -->
    <rect x="17" y="30.5" width="4.5" height="4.5" rx="1.2" fill="#06b6d4" />
    <path d="M 18.2 32.7 L 19.2 33.7 L 20.4 31.7" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="23" y="31.5" width="11" height="2.5" rx="1.25" fill="#64748b" />

    <!-- Line Row 3 -->
    <rect x="17" y="39" width="20" height="2.5" rx="1.25" fill="#94a3b8" fill-opacity="0.8" />

    <!-- Success Checkmark Badge -->
    <circle cx="45" cy="45" r="9.5" fill="url(#fullBadgeGrad)" stroke="#ffffff" stroke-width="1.5" />
    <path d="M 41.5 45.2 L 44 47.7 L 49 42.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Tiny Sparkles -->
    <path d="M 52 10 Q 52 13, 49 13 Q 52 13, 52 16 Q 52 13, 55 13 Q 52 13, 52 10 Z" fill="#facc15" />
  </g>

  <!-- Typography: Iskak:FormGenerator -->
  <g transform="translate(74, 0)">
    <!-- Primary Brand Title -->
    <text x="0" y="32" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#ffffff">Iskak</tspan>
      <tspan fill="#38bdf8" font-weight="900">:</tspan>
      <tspan fill="url(#textAccentGrad)" font-weight="700">Form</tspan>
      <tspan fill="#ffffff" font-weight="600">Generator</tspan>
    </text>

    <!-- Subtitle / Tagline Badge -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="138" height="17" rx="8.5" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="8" cy="8.5" r="3" fill="#10b981" />
      <text x="16" y="12" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#cbd5e1" letter-spacing="0.8">
        CLOUD FORM WORKSPACE
      </text>
    </g>
  </g>
</svg>
